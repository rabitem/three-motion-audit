version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Proposes a release only after it has been public for a week, so a compromised
    # minor or patch is usually pulled before it can auto-merge.
    cooldown:
      default-days: 7
    # TypeScript majors change the compiler itself (7 is the native one); adopt them by hand.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflows pin actions by commit SHA; these PRs keep the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
